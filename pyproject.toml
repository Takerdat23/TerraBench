[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrabench"
version = "1.0.0a0"
description = "TerraBench benchmark and TerraAgent execution framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  "requests",
  "python-dotenv",
  "certifi",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
simulators = ["aquacrop", "pythermalcomfort", "eclipse-sumo"]
web = [
  "requests",
  "python-dotenv",
  "certifi",
  "pypdf",
  "openai",
  "anthropic",
]
satellite = [
  "earthengine-api",
  "requests",
  "python-dotenv",
  "certifi",
  "numpy",
  "matplotlib",
  "xarray",
  "netcdf4",
  "rasterio",
]
full-agent = [
  "agentscope",
  "python-dotenv",
  "requests",
  "tenacity",
  "certifi",
  "pypdf",
  "openai",
  "anthropic",
  "google-generativeai",
  "cdsapi",
  "ecmwf-datastores-client",
  "openmeteo-requests",
  "requests-cache",
  "retry-requests",
  "earthengine-api",
  "numpy",
  "pandas",
  "scipy",
  "xarray",
  "netcdf4",
  "h5py",
  "matplotlib",
  "pillow",
  "pyproj",
  "shapely",
  "rasterio",
  "cartopy",
  "networkx",
  "osmnx",
  "rioxarray",
  "xesmf",
  "intake-esm",
  "dask",
  "zarr",
  "microsoft-aurora",
  "onnxruntime",
  "torch",
  "transformers",
  "qwen-vl-utils",
  "aquacrop",
  "pythermalcomfort",
  "eclipse-sumo",
]
code-agent = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "python-multipart",
  "requests",
  "tenacity",
  "rpyc",
  "docker",
  "gymnasium",
  "scikit-learn",
  "mysql-connector-python",
  "rich",
  "tqdm",
  "openai",
  "anthropic",
  "google-generativeai",
  "config",
  "simplejson",
]

[tool.setuptools.packages.find]
include = ["terrabench*", "terra_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
